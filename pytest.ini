[pytest]
testpaths = tests
# Makes `import app` work for the `pytest` console script (CI) — without this,
# running `pytest` (not `python -m pytest`) fails to import the package.
pythonpath = .
python_files = test_*.py
addopts = -q --strict-markers
markers =
    slow: tests that take more than a couple of seconds (concurrency)
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:jose.*
