name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: bb, POSTGRES_PASSWORD: bb, POSTGRES_DB: bb}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bb" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://bb:bb@localhost:5432/bb
      SECRET_KEY: test-secret-key-at-least-32-characters
      PENDING_EXPIRE_HOURS: "24"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python -m app.seed

      # The frontend speaks exactly this contract (frontend/src/api/endpoints.js);
      # this step fails as soon as a response shape drifts.
      - name: API contract check
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level warning &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then break; fi
            sleep 1
          done
          python scripts/contract_check.py

      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
